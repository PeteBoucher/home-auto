{% if has_climate_data %}
<div class="bg-white rounded-xl shadow-sm p-5 mb-6">
  <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
    <p class="text-xs text-gray-400 font-medium uppercase tracking-wide">Climate — Temp (°C, solid) / Humidity (%, dashed)</p>
    <div class="flex gap-2">
      {% for h, label in [(1, "1h"), (6, "6h"), (24, "24h"), (168, "7d")] %}
      <button onclick="loadClimateWidget({{ h }})" id="climate-btn-{{ h }}"
        class="px-3 py-1 text-sm rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors">
        {{ label }}
      </button>
      {% endfor %}
    </div>
  </div>
  <canvas id="climate-widget-chart"></canvas>
</div>

<script src="/static/chart.umd.min.js"></script>
<script src="/static/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
  let climateWidgetChart;
  let climateWidgetHours = 6;
  const CLIMATE_WIDGET_COLORS = ['#3B82F6', '#F59E0B', '#10B981', '#EC4899', '#8B5CF6', '#EF4444', '#06B6D4', '#84CC16'];

  function climateWidgetEmptyState(canvas, text) {
    const ctx = canvas.getContext('2d');
    canvas.height = 60;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#9CA3AF';
    ctx.font = '13px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(text, canvas.width / 2, 36);
  }

  // Humidity traces share their room's colour with the temperature trace but
  // use a dashed line + right-hand axis, so a room reads as one visual unit
  // (same colour) while still being distinguishable (solid vs dashed, and
  // which axis a value belongs to).
  function climateWidgetDatasets(data, labels) {
    const datasets = [];
    labels.forEach(label => {
      const color = CLIMATE_WIDGET_COLORS[labels.indexOf(label) % CLIMATE_WIDGET_COLORS.length];
      const series = data[label];
      const points = metric => series.timestamps.map((t, j) => ({ x: new Date(t + 'Z'), y: series[metric][j] }));
      if (series.temperature.some(v => v !== null)) {
        datasets.push({
          label,
          data: points('temperature'),
          borderColor: color,
          borderWidth: 1.5,
          tension: 0.3,
          pointRadius: 0,
          fill: false,
          yAxisID: 'y',
        });
      }
      if (series.humidity.some(v => v !== null)) {
        datasets.push({
          label: label + ' (RH)',
          data: points('humidity'),
          borderColor: color,
          borderWidth: 1.5,
          borderDash: [5, 4],
          tension: 0.3,
          pointRadius: 0,
          fill: false,
          yAxisID: 'y1',
        });
      }
    });
    return datasets;
  }

  async function loadClimateWidget(hours) {
    climateWidgetHours = hours;
    [1, 6, 24, 168].forEach(h => {
      const btn = document.getElementById('climate-btn-' + h);
      btn.className = h === hours
        ? 'px-3 py-1 text-sm rounded-lg bg-blue-600 text-white transition-colors'
        : 'px-3 py-1 text-sm rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors';
    });

    const resp = await fetch('/climate/data?hours=' + hours);
    const data = await resp.json();
    const labels = Object.keys(data);

    const canvas = document.getElementById('climate-widget-chart');
    if (climateWidgetChart) climateWidgetChart.destroy();

    if (labels.length === 0) {
      climateWidgetEmptyState(canvas, 'No data for this period');
      return;
    }

    climateWidgetChart = new Chart(canvas, {
      type: 'line',
      data: { datasets: climateWidgetDatasets(data, labels) },
      options: {
        responsive: true,
        animation: false,
        plugins: {
          legend: { display: true, position: 'top', labels: { color: '#6B7280', font: { size: 12 } } },
        },
        scales: {
          x: {
            type: 'time',
            // Chart.js auto-picks the tick unit from the actual data span, not
            // the requested window — force day-of-week ticks on the 7d view so
            // it doesn't fall back to confusing hour-of-day ticks when less
            // than 7 days of history has accumulated yet.
            time: hours === 168
              ? { unit: 'day', tooltipFormat: 'EEE dd MMM', displayFormats: { day: 'EEE' } }
              : { tooltipFormat: 'dd MMM HH:mm', displayFormats: { minute: 'HH:mm', hour: 'HH:mm', day: 'dd MMM' } },
            grid: { color: '#F3F4F6' },
            ticks: { color: '#9CA3AF', font: { size: 11 } },
          },
          y: {
            position: 'left',
            title: { display: true, text: '°C', color: '#9CA3AF', font: { size: 11 } },
            grid: { color: '#F3F4F6' },
            ticks: { color: '#9CA3AF', font: { size: 11 } },
          },
          y1: {
            position: 'right',
            title: { display: true, text: '% RH', color: '#9CA3AF', font: { size: 11 } },
            grid: { drawOnChartArea: false },
            ticks: { color: '#9CA3AF', font: { size: 11 } },
            min: 0,
            max: 100,
          },
        },
      },
    });
  }

  loadClimateWidget(6);
  // Match the device grid's own refresh cadence (index.html hx-trigger="every 30s")
  // so the chart doesn't visibly lag behind the rest of the dashboard.
  setInterval(() => loadClimateWidget(climateWidgetHours), 30000);
</script>
{% endif %}
