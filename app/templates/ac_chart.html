{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="/" class="text-gray-400 hover:text-gray-600 transition-colors">
      <i class="bi bi-arrow-left"></i>
    </a>
    <h1 class="text-xl font-semibold text-gray-800">{{ device.name }} — Temperature History</h1>
  </div>

  <div class="flex gap-2 mb-4">
    {% for h, label in [(1, "1h"), (6, "6h"), (24, "24h"), (168, "7d")] %}
    <button onclick="loadChart({{ h }})" id="btn-{{ h }}"
      class="px-3 py-1 text-sm rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors">
      {{ label }}
    </button>
    {% endfor %}
  </div>

  <div class="bg-white rounded-xl shadow-sm p-5">
    <p class="text-xs text-gray-400 font-medium mb-3 uppercase tracking-wide">Temperature (°C)</p>
    <canvas id="ac-temp-chart"></canvas>
  </div>
</div>

<script src="/static/chart.umd.min.js"></script>
<script src="/static/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
  let chart;

  const SERIES = [
    { key: 'indoor_temp', label: 'Indoor', color: '#3B82F6' },
    { key: 'outdoor_temp', label: 'Outdoor', color: '#10B981' },
  ];

  const sunLinesPlugin = {
    id: 'sunLines',
    afterDraw(c) {
      const events = c.$sunEvents;
      if (!events || !events.length) return;
      const { ctx, chartArea, scales } = c;
      ctx.save();
      events.forEach(ev => {
        const x = scales.x.getPixelForValue(ev.time.getTime());
        if (x < chartArea.left || x > chartArea.right) return;
        ctx.strokeStyle = ev.type === 'sunrise' ? '#FBBF24' : '#F97316';
        ctx.setLineDash([4, 3]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, chartArea.top);
        ctx.lineTo(x, chartArea.bottom);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = ev.type === 'sunrise' ? '#B45309' : '#C2410C';
        ctx.font = '10px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(ev.type === 'sunrise' ? 'sunrise' : 'sunset', x, chartArea.top + 10);
      });
      ctx.restore();
    },
  };
  Chart.register(sunLinesPlugin);

  async function loadChart(hours) {
    [1, 6, 24, 168].forEach(h => {
      const btn = document.getElementById('btn-' + h);
      btn.className = h === hours
        ? 'px-3 py-1 text-sm rounded-lg bg-blue-600 text-white transition-colors'
        : 'px-3 py-1 text-sm rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors';
    });

    const resp = await fetch('/devices/{{ device.id }}/ac-chart/data?hours=' + hours);
    const data = await resp.json();

    const canvas = document.getElementById('ac-temp-chart');
    if (data.timestamps.length === 0) {
      const ctx = canvas.getContext('2d');
      canvas.height = 60;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#9CA3AF';
      ctx.font = '13px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('No data for this period', canvas.width / 2, 36);
      return;
    }

    const pts = key => data.timestamps
      .map((t, i) => ({ x: new Date(t + 'Z'), y: data[key][i] }))
      .filter(p => p.y !== null && p.y !== undefined);

    // "Selected" is the unit's target temp — meaningless while the AC is off,
    // so drop points sampled during off periods instead of drawing a flat
    // line at whatever stale setpoint happened to be cached. Points from
    // before ac_state was tracked (null) are kept rather than hidden.
    const selectedPts = data.timestamps
      .map((t, i) => ({ x: new Date(t + 'Z'), y: data.temperature[i], on: data.ac_state[i] }))
      .filter(p => p.y !== null && p.y !== undefined && p.on !== false);

    const datasets = [
      { label: 'Selected', color: '#F59E0B', data: selectedPts },
      ...SERIES.map(({ key, label, color }) => ({ label, color, data: pts(key) })),
    ];

    if (chart) chart.destroy();
    chart = new Chart(canvas, {
      type: 'line',
      data: {
        datasets: datasets.map(({ label, color, data }) => ({
          label,
          data,
          borderColor: color,
          backgroundColor: color + '18',
          borderWidth: 1.5,
          tension: 0.3,
          pointRadius: 0,
          fill: false,
        })),
      },
      options: {
        responsive: true,
        animation: false,
        plugins: {
          legend: { display: true, position: 'top', labels: { color: '#6B7280', font: { size: 12 } } },
        },
        scales: {
          x: {
            type: 'time',
            time: {
              tooltipFormat: 'dd MMM HH:mm',
              displayFormats: { minute: 'HH:mm', hour: 'HH:mm', day: 'dd MMM' },
            },
            grid: { color: '#F3F4F6' },
            ticks: { color: '#9CA3AF', font: { size: 11 } },
          },
          y: {
            title: { display: true, text: '°C', color: '#9CA3AF', font: { size: 11 } },
            grid: { color: '#F3F4F6' },
            ticks: { color: '#9CA3AF', font: { size: 11 } },
          },
        },
      },
    });

    chart.$sunEvents = hours === 168
      ? []
      : (data.sun_events || []).map(e => ({ type: e.type, time: new Date(e.time) }));
    chart.update('none');
  }

  loadChart(6);
</script>
{% endblock %}
